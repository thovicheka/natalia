# PostgreSQL 16 settings for Natalia on a shared 2 vCPU / 4 GB server (task 1.2).
# Install (sudo): copy to /etc/postgresql/16/main/conf.d/natalia.conf, then restart postgresql.
# Ubuntu's postgresql.conf reads conf.d/ last, so these override its defaults.
# Target: PostgreSQL <= 250 MB (docs/ROADMAP.md, memory budget).

# Localhost only (Ubuntu's default too; set here so it can't drift).
listen_addresses = 'localhost'

# Few clients: the daily flow, the bot, later the website, plus a psql session.
# Default is 100; every connection is a process of ~5-10 MB.
max_connections = 20

# Page cache inside PostgreSQL. Default 128MB; Natalia's data is small (tens of MB in year one)
# and the OS page cache holds the rest.
shared_buffers = 64MB

# Per sort/hash, per query step. Default 4MB is fine for this data size.
work_mem = 4MB

# Index builds (the HNSW index on embeddings) and VACUUM. Default 64MB; kept, stated explicitly.
maintenance_work_mem = 64MB

# Planner hint only, allocates nothing: the RAM the OS can likely spare for caching.
effective_cache_size = 512MB

# JIT loads LLVM into a backend (tens of MB) to speed up big analytic queries we don't run.
jit = off

# Default 3 autovacuum workers; 2 is plenty for a handful of tables.
autovacuum_max_workers = 2
