# Natalia's news feeds, one entry per feed. Read by natalia/feeds.py (and the collector, task 1.3).
#
# Fields: name, topic (one of the 9 in docs/PLAN.md), url (RSS/Atom), language (en|km, default en),
# paywalled (default false), enabled (default true), note (why disabled, or a caveat).
#
# paywalled: true -> headline + excerpt + link from the feed only; never fetch the article page.
#   Hard paywalls (Bloomberg, FT, WSJ, The Athletic) plus metered ones (The Economist, Foreign Affairs,
#   Wired, MIT Technology Review, Nature, Scientific American, New Scientist, MarketWatch, Nikkei Asia).
# enabled: false -> checked on 2026-10-15 and dead or broken; kept so nobody re-adds it blindly.
#   Also: the Google News feeds (news.google.com's robots.txt disallows them; Natalia respects it).
#
# Check them all: uv run python -m natalia.feeds --all
sources:
